name: ci-typecheck

on:
  push:
    branches: [master]
    paths: ["*.ts", "types/**", ".github/workflows/ci-ts.yml", "package.json", "tsconfig.ci.json"]
  pull_request:
    paths: ["*.ts", "types/**", ".github/workflows/ci-ts.yml", "package.json", "tsconfig.ci.json"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned deps (typescript 5.9.3, typebox 1.3.7, @types/node 22)
        run: npm install --no-fund --no-audit
      - name: tsc --noEmit
        run: npx tsc -p tsconfig.ci.json
